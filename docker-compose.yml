services:
  # L'application : /v1 (historique), /v2 (à livrer), /analyse (gateway canary).
  app:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      LLM_PROXY_URL: http://proxy:8080
      METRICS_PATH: /app/ops/metrics.jsonl
      REGISTRY_PATH: /app/ops/registry
    volumes:
      - ./ops:/app/ops          # registre, journal et métriques partagés avec le dashboard
      - ./models:/app/models
      - ./eval:/app/eval
    depends_on:
      - proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"   # pour joindre Ollama sur la machine hôte

  # Le proxy de dérive, entre l'app et le fournisseur LLM (Azure ou Ollama).
  proxy:
    build: .
    command: python -m ops.drift_proxy
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      AZURE_AI_ENDPOINT: http://azure-adapter:9000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - azure-adapter

  # Adaptateur Azure — NON fourni, voir ops/azure_adapter.py (docstring).
  # Corrige deux écarts entre le proxy fourni et l'API /openai/v1 de cette
  # ressource Azure : api-version non supportée, max_tokens → max_completion_tokens.
  azure-adapter:
    build: .
    command: python -m ops.azure_adapter
    env_file: .env
    environment:
      AZURE_AI_REAL_ENDPOINT: ${AZURE_AI_ENDPOINT}

  # Le tableau de bord (à implémenter : ops/dashboard.py).
  dashboard:
    build: .
    command: python -m ops.dashboard --serve --port 8501
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      METRICS_PATH: /app/ops/metrics.jsonl
      REGISTRY_PATH: /app/ops/registry
    volumes:
      - ./ops:/app/ops
    depends_on:
      - app
