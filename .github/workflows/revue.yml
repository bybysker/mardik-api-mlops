name: Revue — preuve d'approbation

# Pose revue-ok/<sha7> quand connarddu16-design (compte GitHub dédié à la
# revue, jamais le développeur — créé le 2026-09-23, collaborateur `write`
# sur ce dépôt ; la conception le nommait `mardik-relecteur`, nom de
# travail jamais enregistré) approuve une PR feature/x -> dev, sur le SHA
# de tête de la PR. Ce que le tag atteste n'est pas « une approbation »
# mais « une approbation sur du code dont le lot A est vert » : depuis le
# 2026-09-23 (intention I3), la pose du tag est précédée d'un garde qui
# lit le résultat de ci.yml sur ce SHA et refuse si le lot A n'a pas
# conclu `success`. Auto-revue assumée : le second compte est un mécanisme
# de fraîcheur (le SHA approuvé doit être celui de tête), pas une deuxième
# personne — même principe que le pipeline QualiCheck
# (/projets/QualiCheck/.gitea/workflows/revue.yml), adapté à la vraie
# payload GitHub (review.state == 'approved', review.user.login — sur
# Gitea ces deux champs ont un nom différent, cf. le commentaire de leur
# fichier ; ici on utilise les champs GitHub natifs).
#
# Cible dev, pas main (révisé 2026-09-23, écart 1 de intents.md — voir
# docs/conception_revue/chantier1_llmops/gel-eval-avant-fusion.md) : la
# conception d'origine faisait développer directement sur dev, la revue
# portait donc sur dev -> main. Une branche feature/x s'intercale
# désormais avant dev, pour que dev ne contienne que du code relu. La
# fusion dev -> main qui suit reste fast-forward strict, comme le prévoyait
# déjà la conception d'origine
# (docs/superpowers/specs/2026-09-22-chaine-llmops-design.md).

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  revue-ok:
    if: >-
      github.event.review.state == 'approved'
      && github.event.review.user.login == 'connarddu16-design'
      && github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout au SHA relu
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.CI_TAG_TOKEN }}

      - name: Vérifier que le lot A est vert sur ce SHA
        env:
          GH_TOKEN: ${{ secrets.CI_TAG_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # I3 — le relecteur doit avoir la certitude que le lot A passe, pas
          # seulement la possibilité d'aller voir. Pas de needs: possible :
          # ci.yml appartient à une autre exécution, déclenchée par un push.
          # On vise ci.yml nommément, pas tous les check-runs du SHA :
          # l'alerte d'évaluation (alerte-eval.yml) est un signal et ne doit
          # rien conditionner.
          for i in $(seq 1 30); do
            ETAT=$(gh api \
              "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"' || echo "absent")
            case "$ETAT" in
              "completed success") echo "[ok] lot A vert sur $SHA"; exit 0 ;;
              "completed "*)       echo "[refus] lot A en échec sur $SHA ($ETAT)"; exit 1 ;;
              *)                   echo "[attente] lot A : $ETAT ($i/30)"; sleep 20 ;;
            esac
          done
          echo "[refus] le lot A n'a pas conclu en 10 min sur $SHA"
          exit 1

      - name: Poser revue-ok sur le SHA relu
        run: |
          SHA="${{ github.event.pull_request.head.sha }}"
          SHA7=$(git rev-parse --short=7 "$SHA")
          if git tag --points-at "$SHA" | grep -q '^revue-ok/'; then
            echo "[ok] revue-ok déjà posé sur $SHA (nouvelle approbation sur le même SHA)"
            exit 0
          fi
          git config user.name "mardik-ci"
          git config user.email "mardik-ci@users.noreply.github.com"
          git tag "revue-ok/$SHA7" "$SHA"
          git push origin "revue-ok/$SHA7"
          echo "[ok] revue-ok/$SHA7 posé sur $SHA"
